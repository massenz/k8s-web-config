# Creates a Kind cluster ready to install Istio
#
# kind-config.yaml

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
    - containerPort: 32100
      hostPort: 80
      listenAddress: "127.0.0.1"
      protocol: TCP

    - containerPort: 30002
      hostPort: 15021
      listenAddress: "127.0.0.1"
      protocol: TCP
